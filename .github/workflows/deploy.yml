name: Deploy to cPanel via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      # Precompile the JSX so visitors don't download Babel or compile the app on every load.
      # A compile error fails the job here, before anything is uploaded.
      - name: Precompile scripts
        run: |
          npm ci --prefix tools
          node tools/build.mjs .

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          # FTP account is rooted at /home/cromtest/crm.greenmed.uk
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            .tools/**
            tools/**
            CLAUDE.md
            README.md
            serve.ps1
            index_backup_monolith.html
            database/**
            docs/**
            api/config.sample.php
